[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odacea"
version = "0.3.0"
description = "Outil d'audit optimisé par intelligence artificielle pour les archives électroniques"
authors = [{name = "Aulsen Dzangui"}]
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
# Source de vérité des dépendances d'exécution (alignée sur requirements.txt).
# `pip install -e .` suffit à obtenir un `odacea` fonctionnel (CLI + API).
dependencies = [
    # litellm : plancher à 1.84 (vulnérabilités corrigées) et borne ouverte — les
    # versions récentes publient des roues jusqu'à cp314. pandas : borne haute par
    # prudence (pandas 3 change des comportements par défaut). Voir les
    # commentaires de requirements.txt — les deux fichiers doivent rester alignés.
    "litellm>=1.84",
    "pandas>=2.2.0,<3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # Enrichissement mécanique (étape `enrich`) — imports paresseux par format.
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
# Outillage de développement — miroir de requirements-dev.txt.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",  # audit de vulnérabilités des dépendances
    "build>=1.0",      # construction du wheel/sdist de release
]

[project.scripts]
# Point d'entrée console : `pip install -e .` → `odacea audit ...`
# (remplace `python cli.py ...`). `main()` renvoie le code de sortie EXIT_*.
odacea = "cli:main"

[project.urls]
Homepage = "https://github.com/AulsenDzangui/odacea"

# ── Packaging ─────────────────────────────────────────────────────────────────
# Disposition « à plat » : le module `cli` et les paquets du moteur vivent à la
# racine de backend/. On les déclare explicitement pour que l'auto-découverte
# n'embarque ni les tests ni les répertoires de données (evals/, demo_assets/).

[tool.setuptools]
py-modules = ["cli"]
packages = ["api", "config", "core", "llm", "prompts"]

# ── Outillage qualité ─────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # messages français longs (logs, hints) : la longueur de ligne
             # n'est pas bloquante, le reste du style l'est.
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() doit précéder les imports qui lisent l'environnement.
"cli.py" = ["E402"]
"api/main.py" = ["E402"]

[tool.mypy]
# Adoption progressive : on vérifie le cœur métier (core/) sans imposer
# l'annotation exhaustive ; les dépendances sans stubs sont tolérées.
files = ["core"]
# Cible d'**analyse**, alignée sur l'interpréteur réellement utilisé (CI et image
# Docker en 3.12). À 3.10, mypy refusait de parser les stubs de numpy ≥ 2.5, qui
# emploient `type X = …` (PEP 695, 3.12+) : un échec de build dû à la *syntaxe
# d'une dépendance*, pas au code du projet — et `follow_imports = "skip"` n'y
# change rien, l'erreur survenant au parsing du stub. Le plancher d'**exécution**
# reste `requires-python = ">=3.10"` ; c'est `ruff` (`target-version = "py310"`)
# qui garde la compatibilité descendante de notre propre code.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
