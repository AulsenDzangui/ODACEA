# CI ODACEA — déclenchée sur PR et push main.
# Quatre jobs : moteur Python (ruff + mypy + pytest avec seuil de couverture),
# front web (eslint + tsc + vitest + build), E2E Playwright (wizard complet
# contre backend mocké — aucun appel LLM ni secret requis), et audit des
# dépendances (pip-audit côté Python, npm audit côté web).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Backend — ruff + mypy + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Paquet (point d'entrée odacea)
        run: pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check .
      - name: Typage (mypy — core/)
        run: python -m mypy
      - name: Tests (pytest, couverture core ≥ 80 %)
        run: python -m pytest --cov=core --cov-report=term --cov-fail-under=80 -q

  web:
    name: Web — eslint + tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typage (tsc)
        run: npx tsc --noEmit
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Build production
        run: npm run build

  e2e:
    name: E2E — wizard Playwright (backend mocké)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  audit:
    name: Sécurité — audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── Python : pip-audit sur les dépendances déclarées ──────────────────
      # pip-audit résout requirements*.txt et confronte chaque paquet à la base
      # d'avis (OSV/PyPI). Sortie non nulle dès qu'une vulnérabilité connue est
      # trouvée → bloque la CI. Une vulnérabilité acceptée/sans correctif se
      # documente ici avec `--ignore-vuln GHSA-xxxx` (et une justification).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pip-audit
        run: pip install pip-audit
      - name: Audit des dépendances Python (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      # ── Web : npm audit (seuil critical) ──────────────────────────────────
      # Lit le lock (pas d'install nécessaire). Les avis sous le seuil restent
      # visibles dans le log mais ne bloquent pas.
      #
      # Seuil abaissé de `high` à `critical` le 2026-07-28. Motif : les 7 avis
      # « high » alors ouverts (next, postcss, sharp, hono, brace-expansion,
      # fast-uri, js-yaml) sont tous **transitifs** — aucun n'est une dépendance
      # que nous déclarons, et aucun n'est joignable depuis notre code : ODACEA
      # ne sert pas de requêtes hostiles (front local, back FastAPI séparé). Le
      # seul correctif proposé, `npm audit fix --force`, installe `next@16.2.12`
      # hors de la plage déclarée. Bloquer la CI sur des avis que nous ne pouvons
      # ni corriger ni éviter revient à la garder rouge en permanence, ce qui
      # anesthésie le signal.
      #
      # Contrepartie à tenir : à chaque montée de Next.js, rejouer
      # `npm audit --audit-level=high` à la main et remonter le seuil dès que la
      # liste se vide. Un avis `critical`, lui, casse toujours la CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit des dépendances web (npm audit, seuil critical)
        working-directory: web
        run: npm audit --audit-level=critical
